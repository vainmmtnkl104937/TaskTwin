name: Runner release dry run

on:
  pull_request:
    paths:
      - '.github/workflows/release-runner.yml'
      - '.github/workflows/runner-release-dry-run.yml'
      - 'apps/local-runner/**'
      - 'packages/runner-release/**'
      - 'packages/runner-protocol/**'
      - 'packages/run-protocol/**'
      - 'packages/workflow-schema/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_dry_run:
    name: Build, package, and inspect without production signing
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Install frozen dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global corepack@0.34.5
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Run repository quality gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install pinned Chromium and WinSW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'runner-release-browsers'
          pnpm --filter @tasktwin/local-runner exec playwright install chromium
          pnpm --filter @tasktwin/local-runner service:prepare-windows

      - name: Run secret-free packaging dry run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $browserRoot = Join-Path $env:RUNNER_TEMP 'runner-release-browsers'
          $output = Join-Path $env:RUNNER_TEMP "runner-release-dry-run-$env:GITHUB_RUN_ID"
          pnpm --filter @tasktwin/local-runner release:dry-run -- `
            --output-dir $output `
            --browser-source $browserRoot `
            --built-at ([DateTime]::UtcNow.ToString('o'))
