<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTwin Recorder</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">TaskTwin</p>
      <h1>TaskTwin Recorder</h1>
      <p class="status" role="status">
        Status:
        <strong data-recorder-status data-status="idle">Idle</strong>
      </p>
      <dl class="timeline-summary" aria-label="Captured event summary">
        <div>
          <dt>Captured events</dt>
          <dd data-recorder-event-count>0</dd>
        </div>
        <div>
          <dt>Latest action</dt>
          <dd data-recorder-latest-event>None</dd>
        </div>
      </dl>
      <div class="controls" aria-label="Recording controls">
        <button type="button" data-recorder-action="start" disabled>
          Start Recording
        </button>
        <button type="button" data-recorder-action="pause" disabled>
          Pause Recording
        </button>
        <button type="button" data-recorder-action="resume" disabled>
          Resume Recording
        </button>
        <button type="button" data-recorder-action="stop" disabled>
          Stop Recording
        </button>
        <button type="button" data-recorder-action="reset" disabled>
          Reset Recorder
        </button>
      </div>
      <p class="error" role="alert" data-recorder-error hidden></p>
      <p class="hint">
        Recording stays bound to the selected tab for this browser session.
      </p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
