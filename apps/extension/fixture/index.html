<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTwin Recorder Fixture</title>
    <style>
      body {
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: system-ui, sans-serif;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      label,
      fieldset {
        display: grid;
        gap: 0.35rem;
      }

      button,
      input,
      select {
        min-height: 2.5rem;
        font: inherit;
      }

      .fixture-fallback-only::after {
        content: 'Fallback-only target';
      }

      .fixture-stable-id::after {
        content: 'Unique stable-ID target';
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TaskTwin Recorder Fixture</h1>
      <form>
        <button type="button" data-testid="nested-action">
          <span aria-hidden="true">★</span>
          <span>Run fixture action</span>
        </button>

        <button type="button" aria-label="Open recorder settings">
          <span aria-hidden="true">⚙</span>
        </button>

        <button
          id="stable-id-action"
          class="fixture-stable-id"
          type="button"
          title="Unique stable-ID target"
        ></button>

        <label>
          Text input
          <input
            id="fixture-text"
            name="fixtureText"
            type="text"
            placeholder="Type several characters"
          />
        </label>

        <input
          type="search"
          placeholder="Placeholder-only search"
          aria-describedby="placeholder-help"
        />
        <small id="placeholder-help">Input with no associated label</small>

        <section>
          <button type="button" class="duplicate-first">Continue</button>
          <button type="button" class="duplicate-second">Continue</button>
        </section>

        <input
          id="react-57a1a7d4-5ada-4bc8-ac17-10c84746a567"
          type="text"
          aria-describedby="generated-id-help"
        />
        <small id="generated-id-help">Generated-ID input</small>

        <button
          type="button"
          class="fixture-fallback-only"
          title="Fallback-only target"
        ></button>

        <label>
          Password
          <input
            id="fixture-password"
            name="fixturePassword"
            type="password"
            autocomplete="current-password"
          />
        </label>

        <label>
          One-time code
          <input
            id="fixture-otp"
            name="fixtureOtp"
            type="text"
            autocomplete="one-time-code"
          />
        </label>

        <label>
          Select an option
          <select id="fixture-select" name="fixtureSelect">
            <option value="first">First option</option>
            <option value="second">Second option</option>
          </select>
        </label>

        <label>
          <input id="fixture-checkbox" name="fixtureCheckbox" type="checkbox" />
          Enable fixture option
        </label>

        <fieldset>
          <legend>Radio group</legend>
          <label>
            <input type="radio" name="fixtureRadio" value="alpha" />
            Alpha
          </label>
          <label>
            <input type="radio" name="fixtureRadio" value="beta" />
            Beta
          </label>
        </fieldset>
      </form>
    </main>
  </body>
</html>
