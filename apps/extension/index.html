<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTwin Recorder</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">TaskTwin</p>
      <h1>TaskTwin Recorder</h1>
      <p class="status" role="status">
        Status: <strong data-status>Idle</strong>
      </p>
      <div class="controls" aria-label="Recording controls">
        <button type="button" disabled>Start Recording</button>
        <button type="button" disabled>Stop Recording</button>
      </div>
      <p class="hint">
        Recording controls will be enabled in a future session.
      </p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
