<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTwin Recorder Fixture</title>
    <style>
      body {
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: system-ui, sans-serif;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      label,
      fieldset {
        display: grid;
        gap: 0.35rem;
      }

      button,
      input,
      select {
        min-height: 2.5rem;
        font: inherit;
      }

      .fixture-fallback-only::after {
        content: 'Fallback-only target';
      }

      .fixture-stable-id::after {
        content: 'Unique stable-ID target';
      }

      .privacy-fixture {
        border-top: 1px solid #cbd5e1;
        margin-top: 1rem;
        padding-top: 1rem;
      }

      .privacy-overlap {
        display: grid;
      }

      .privacy-overlap > input {
        grid-area: 1 / 1;
      }

      .privacy-overlap > input:last-child {
        margin: 0.3rem 0 0 0.3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TaskTwin Recorder Fixture</h1>
      <form>
        <button type="button" data-testid="nested-action">
          <span aria-hidden="true">★</span>
          <span>Run fixture action</span>
        </button>

        <button type="button" aria-label="Open recorder settings">
          <span aria-hidden="true">⚙</span>
        </button>

        <button
          id="stable-id-action"
          class="fixture-stable-id"
          type="button"
          title="Unique stable-ID target"
        ></button>

        <label>
          Text input
          <input
            id="fixture-text"
            name="fixtureText"
            type="text"
            placeholder="Type several characters"
          />
        </label>

        <input
          type="search"
          placeholder="Placeholder-only search"
          aria-describedby="placeholder-help"
        />
        <small id="placeholder-help">Input with no associated label</small>

        <section>
          <button type="button" class="duplicate-first">Continue</button>
          <button type="button" class="duplicate-second">Continue</button>
        </section>

        <input
          id="react-57a1a7d4-5ada-4bc8-ac17-10c84746a567"
          type="text"
          aria-describedby="generated-id-help"
        />
        <small id="generated-id-help">Generated-ID input</small>

        <button
          type="button"
          class="fixture-fallback-only"
          title="Fallback-only target"
        ></button>

        <label>
          Password
          <input
            id="fixture-password"
            name="fixturePassword"
            type="password"
            autocomplete="current-password"
          />
        </label>

        <label>
          One-time code
          <input
            id="fixture-otp"
            name="fixtureOtp"
            type="text"
            autocomplete="one-time-code"
          />
        </label>

        <label>
          Select an option
          <select id="fixture-select" name="fixtureSelect">
            <option value="first">First option</option>
            <option value="second">Second option</option>
          </select>
        </label>

        <label>
          <input id="fixture-checkbox" name="fixtureCheckbox" type="checkbox" />
          Enable fixture option
        </label>

        <fieldset>
          <legend>Radio group</legend>
          <label>
            <input type="radio" name="fixtureRadio" value="alpha" />
            Alpha
          </label>
          <label>
            <input type="radio" name="fixtureRadio" value="beta" />
            Beta
          </label>
        </fieldset>

        <section class="privacy-fixture" data-tasktwin-privacy-fixture>
          <h2>Privacy fixture</h2>

          <label>
            Ordinary note
            <input
              data-testid="privacy-ordinary-note"
              name="ordinaryNote"
              type="text"
              autocomplete="off"
            />
          </label>

          <label>
            Email address
            <input
              data-testid="privacy-email"
              name="email"
              type="email"
              autocomplete="email"
            />
          </label>

          <label>
            Phone number
            <input
              data-testid="privacy-phone"
              name="phone"
              type="tel"
              autocomplete="tel"
            />
          </label>

          <label>
            Street address
            <input
              data-testid="privacy-address"
              name="streetAddress"
              type="text"
              autocomplete="street-address"
            />
          </label>

          <label>
            Payment card number
            <input
              data-testid="privacy-card-number"
              name="cardNumber"
              type="text"
              autocomplete="cc-number"
              inputmode="numeric"
            />
          </label>

          <label>
            Card security code
            <input
              data-testid="privacy-card-cvv"
              name="cardCvv"
              type="text"
              autocomplete="cc-csc"
              inputmode="numeric"
            />
          </label>

          <label>
            Bank account number
            <input
              data-testid="privacy-bank-account"
              name="bankAccountNumber"
              type="text"
              inputmode="numeric"
            />
          </label>

          <label>
            Bank routing number
            <input
              data-testid="privacy-bank-routing"
              name="routingNumber"
              type="text"
              inputmode="numeric"
            />
          </label>

          <label>
            Citizen identification number
            <input
              data-testid="privacy-citizen-id"
              name="citizenId"
              type="text"
            />
          </label>

          <label>
            Passport number
            <input
              data-testid="privacy-passport"
              name="passportNumber"
              type="text"
            />
          </label>

          <label>
            Medical condition
            <input
              data-testid="privacy-health"
              name="medicalCondition"
              type="text"
            />
          </label>

          <div class="privacy-overlap">
            <input
              aria-label="Overlapping email field"
              name="overlappingEmail"
              type="email"
              autocomplete="email"
            />
            <input
              aria-label="Overlapping phone field"
              name="overlappingPhone"
              type="tel"
              autocomplete="tel"
            />
          </div>

          <button
            data-testid="privacy-safe-structural-id"
            data-tasktwin-privacy-sensitive="true"
            type="button"
          >
            Contact fixture.person@example.test
          </button>
        </section>
      </form>
    </main>
  </body>
</html>
